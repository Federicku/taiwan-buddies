<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taiwan Buddies 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
(function(){var l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75,700;75,800;75,900&family=Atkinson+Hyperlegible:wght@400;700&display=swap";document.head.appendChild(l);})();
</script>
<style>
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --ink:#16202B; --muted:#56636F; --rule:#D3DADD; --chip:#E3E9EA;
  --ok:#00805A; --warn-bg:#FFF4DC; --warn-ink:#7A4B00; --warn-rule:#E8B44C; --brand:#E3002C;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --zh:"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10171D; --surface:#18222A; --ink:#E7ECEF; --muted:#9CA9B3; --rule:#2A3740; --chip:#23303A;
    --ok:#3CC08A; --warn-bg:#3A2C10; --warn-ink:#F6D58C; --warn-rule:#8A6420; --brand:#FF4A63; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171D; --surface:#18222A; --ink:#E7ECEF; --muted:#9CA9B3; --rule:#2A3740; --chip:#23303A;
  --ok:#3CC08A; --warn-bg:#3A2C10; --warn-ink:#F6D58C; --warn-rule:#8A6420; --brand:#FF4A63; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit} button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #0070BD;outline-offset:2px;border-radius:6px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
h2,h3{text-wrap:balance}

.top{padding:18px 0 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:0;font:800 28px/1 var(--display);font-stretch:78%}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.count{text-align:right;flex:none}
.count b{display:block;font:900 42px/.9 var(--display);font-stretch:68%;color:var(--brand)}
.count span{font-size:13px;color:var(--muted)}

.view{display:none;padding-bottom:112px}
.view.on{display:block}
.sec{margin-top:26px}
.sec > h2{margin:0 0 10px;font:800 22px/1.15 var(--display);font-stretch:85%}
.sec > p.lead{margin:-4px 0 12px;color:var(--muted);font-size:14px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-rule);border-radius:14px;padding:12px 14px;font-size:15px;margin-top:12px}
.warn b{display:block;margin-bottom:2px}
.now{margin-top:12px}
.now .lbl{font-size:13px;color:var(--muted)} .now .what{font-weight:700} .now .next{font-size:14px;color:var(--muted);margin-top:3px}
.muted{color:var(--muted)}

/* Boarding pass */
.pass{background:var(--surface);border:1px solid var(--rule);border-radius:18px;overflow:hidden;margin-bottom:12px}
.pass .band{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;color:#fff;font-weight:700;font-size:14px}
.pass .main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 14px 10px;gap:8px}
.iata{font:900 46px/.9 var(--display);font-stretch:72%}
.iata small{display:block;font:400 13px/1.3 var(--body);color:var(--muted);margin-top:4px}
.main .to{text-align:right}
.plane{width:44px;height:2px;background:var(--rule);position:relative}
.plane svg{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);background:var(--surface);color:var(--muted);padding:0 2px}
.pass .facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px dashed var(--rule);padding:10px 14px 12px;gap:10px 8px}
.fact span{display:block;font-size:12px;color:var(--muted)}
.fact b{font-size:15px}
.pass .foot{padding:0 14px 12px;display:flex;flex-wrap:wrap;gap:6px}

/* Hotel */
.hotel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px;margin-bottom:12px;border-left:6px solid var(--c)}
.hotel h3{margin:0;font:800 19px/1.2 var(--display);font-stretch:90%}
.hotel .city{font-size:13px;color:var(--muted)}
.stay{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:12px 0 8px}
.stay div span{display:block;font-size:12px;color:var(--muted)}
.stay div b{font-size:15px}
.stay .nights{font:800 14px/1 var(--display);padding:6px 10px;border-radius:999px;background:var(--chip);white-space:nowrap}
.stay div:last-child{text-align:right}

.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);line-height:1.5}
.tag.paid{border-color:var(--ok);color:var(--ok);font-weight:700}
.tag.unpaid{border-color:var(--warn-rule);color:var(--warn-ink);background:var(--warn-bg);font-weight:700}
.tag.s{border-style:dashed}
.tag.t{border-color:#C9871A;color:#B07513}
.tag.n{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}

.btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 12px;border-radius:10px;background:var(--chip);border:0;text-decoration:none;font-size:14px;font-weight:700;cursor:pointer}
.btn .zh{font:800 15px/1 var(--zh)}
.btn svg{width:16px;height:16px;flex:none}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.reveal{font-variant-numeric:tabular-nums;letter-spacing:.04em}

.crew{display:flex;flex-wrap:wrap;gap:8px}
.crew span{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);font-weight:700;font-size:14px}

/* Week overview */
.week{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.week a{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;text-decoration:none}
.week .wd{text-align:center;border-radius:10px;padding:6px 0;color:#fff;background:var(--c);font:800 13px/1.1 var(--display)}
.week .wd b{display:block;font-size:22px;font-weight:900;font-stretch:75%}
.week .t{font-weight:700;line-height:1.3}
.week .s{font-size:13px;color:var(--muted)}

/* Day rail */
.rail-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--rule)}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 16px;max-width:680px;margin:0 auto}
.rail::-webkit-scrollbar{display:none}
.stn{flex:none;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:50px}
.stn .wk{font-size:11px;color:var(--muted);font-weight:700}
.stn .code{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:900 18px/1 var(--display);font-stretch:75%;color:#fff;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--c)}
.stn .d{font-size:11px;color:var(--muted)}
.stn[aria-current="true"] .code{box-shadow:0 0 0 4px var(--c)}
.stn[aria-current="true"] .wk,.stn[aria-current="true"] .d{color:var(--ink)}

.dayhead{padding:18px 0 4px}
.dayhead .no{font:900 50px/.9 var(--display);font-stretch:66%;color:var(--c)}
.dayhead h2{margin:6px 0 2px;font:800 24px/1.15 var(--display);font-stretch:90%}
.dayhead .date{color:var(--muted);font-size:15px}
.sleep{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--rule)}
.sleep svg{width:18px;height:18px;color:var(--c);flex:none}
.route{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;padding:0;list-style:none}
.route li{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--chip)}
.legend{font-size:13px;color:var(--muted);margin:10px 0 4px;display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--muted);vertical-align:-1px;margin-right:5px}
.legend i.s{border-style:dashed}

.tl{list-style:none;margin:8px 0 0;padding:0}
.stop{display:grid;grid-template-columns:26px 1fr;gap:0 10px}
.when{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font:800 16px/1.2 var(--display);font-stretch:85%;color:var(--c);margin-bottom:3px}
.when small{font:700 12px/1.2 var(--body);color:var(--muted)}
.card .detail{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
.line{position:relative}
.line::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--c)}
.stop:first-child .line::before{top:18px}
.stop:last-child .line::before{bottom:calc(100% - 22px)}
.dot{position:absolute;left:50%;top:15px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--surface);border:4px solid var(--c)}
.stop.sugg .dot{border-style:dashed;border-width:3px;background:var(--bg)}
.stop.live .dot{background:var(--c)}
.card{margin:6px 0 10px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:11px 13px}
.stop.live .card{border-color:var(--c);box-shadow:inset 4px 0 0 var(--c)}
.stop.done .card{opacity:.6}
.card h3{margin:0;font:700 17px/1.3 var(--body)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.card p{margin:7px 0 0;font-size:15px}
.card ul{margin:7px 0 0;padding-left:18px;font-size:15px}

/* Places */
.city{margin-top:22px}
.city h3{margin:0 0 8px;font:800 18px/1.2 var(--display);font-stretch:88%;display:flex;align-items:center;gap:8px}
.city h3 i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.place{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.place b{display:block;line-height:1.3}
.place .zhn{font:500 14px/1.3 var(--zh);color:var(--muted)}
.place .when{font-size:12px;color:var(--muted)}
.place .pa{display:flex;gap:6px}
.place .pa .btn{min-height:40px;padding:6px 10px}

/* Money */
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px}
.tot span{display:block;font-size:13px;color:var(--muted)}
.tot b{font:900 26px/1.1 var(--display);font-stretch:75%;font-variant-numeric:tabular-nums}
.tot.big{grid-column:1/-1;border-color:var(--ink)}
.tot.big b{font-size:34px}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.split div{height:100%}
.keys{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:0}
.exp{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.exp li{padding:11px 13px;border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.exp li:first-child{border-top:0}
.exp .nm{font-weight:700;line-height:1.3}
.exp .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.exp .sub{font-size:13px;color:var(--muted)}
.exp .pp{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.exp .tg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.exp li.total{background:var(--chip)}
.bal{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bal li{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:11px 13px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.bal .who{font-weight:700}
.bal .st{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bal .st.owe{color:var(--warn-ink)}
.bal .st.get{color:var(--ok)}
.bal .sub{font-size:13px;color:var(--muted);grid-column:1/-1}

/* Checklist */
.progress{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:6px 0 4px}
.progress div{height:100%;background:var(--ok);width:0;transition:width .3s}
.check{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.check label{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 13px;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ok);flex:none}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.check small{display:block;color:var(--muted);font-size:13px}
.links{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.links a{display:block;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:10px 13px;text-decoration:none;font-weight:700}
.links a span{display:block;font-weight:400;font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;text-decoration:none;font-size:11.5px;color:var(--muted);font-weight:700}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--brand)}

.zhbox{position:fixed;inset:0;z-index:20;background:var(--surface);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center}
.zhbox.on{display:flex}
.zhbox .big{font:800 clamp(40px,12vw,92px)/1.2 var(--zh);overflow-wrap:anywhere}
.zhbox .en{margin-top:16px;font-size:18px;color:var(--muted)}
.zhbox .hint{margin-top:6px;font-size:14px;color:var(--muted)}
.zhbox button{margin-top:28px;min-width:160px;justify-content:center}
</style>
</head>

<header class="wrap top">
  <div>
    <h1>Taiwan Buddies 2027</h1>
    <p>Jan 16–25. Kaohsiung, Alishan, Taipei</p>

</header>

<div class="rail-wrap" id="railWrap" hidden><nav class="rail" id="rail" aria-label="Trip days"></nav></div>

<main class="wrap">
  <section class="view" id="v-trip"></section>
  <section class="view" id="v-day"></section>
  <section class="view" id="v-places"></section>
  <section class="view" id="v-money"></section>
  <section class="view" id="v-checklist"></section>
</main>

<nav class="nav" aria-label="Sections"><div>

</div></nav>

<div class="zhbox" id="zhbox" role="dialog" aria-modal="true" aria-label="Place name in Chinese">

  <button class="btn" id="zhClose" type="button">Close</button>
</div>

  s2.appendChild(warnBox("From the sheet’s notes","Book buses and HSR ahead for the group. The Alishan walk takes about 2 hours. Confirm locker availability at Chiayi HSR."));}
}

var zb=document.getElementById("zhbox"),lastF=null;

 document.getElementById("nav-day").href="#day-"+di;

 if(view==="day"){renderDay(di);Array.prototype.forEach.call(rail.children,function(b){b.setAttribute("aria-current",String(+b.dataset.i===di));});var c=rail.children[di];if(c)rail.scrollLeft=c.offsetLeft-rail.clientWidth/2+c.clientWidth/2;}

}
